name: Compilar y probar Nexo

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # solo se usa para publicar el APK en una Release cuando creas una etiqueta v*

jobs:
  cliente:
    name: Probar el cliente de Termux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas de prueba
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      # Aviso, no bloquea: sirve para ver los hallazgos de shellcheck sin que una observación tumbe la compilación.
      # Cada hallazgo sale como una anotación con su archivo y su línea (se ven en la página de la ejecución, sin abrir el registro).
      # Los archivos tests/*_tests.sh no se ejecutan solos (los carga run_tests.sh): llevan «# shellcheck shell=bash» en la primera línea.
      - name: shellcheck (solo errores)
        continue-on-error: true
        run: |
          shellcheck -S error -f json1 termux/bin/nexo termux/bin/nexo-tools termux/install.sh tests/run_tests.sh tests/dbus_tests.sh tests/dbus_system_tests.sh tests/dbus_notif_tests.sh tests/net_notif_tests.sh tests/tools_tests.sh tests/usb_tests.sh tests/usb_storage_tests.sh tests/usb_hardware_check.sh tests/usb_storage_hardware_check.sh tests/playerctl_check.sh tests/ci_annotate.sh > "$RUNNER_TEMP/shellcheck.json" || true
          jq -r '.comments[] | "::error file=\(.file),line=\(.line),col=\(.column),title=shellcheck SC\(.code)::\(.message | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))"' "$RUNNER_TEMP/shellcheck.json"
          echo "Hallazgos de shellcheck (solo errores): $(jq '.comments | length' "$RUNNER_TEMP/shellcheck.json")"
          [ "$(jq '.comments | length' "$RUNNER_TEMP/shellcheck.json")" = 0 ]
      - name: Pruebas contra la app simulada
        # Las pruebas con un bus D-Bus real dependen más del entorno: van en el trabajo «dbus» (que no bloquea).
        # (tests/ci_annotate.sh deja la causa de un fallo en una anotación: se ve sin abrir el registro)
        env:
          NEXO_TESTS_DBUS: skip
          NEXO_TESTS_TOOLS: skip
          NEXO_TESTS_USB: skip
        run: bash tests/ci_annotate.sh "Pruebas contra la app simulada" -- bash tests/run_tests.sh

  tools:
    name: Probar nexo-tools (HTTPS, emparejamiento, explorador web) entre dos dispositivos simulados
    runs-on: ubuntu-latest
    # No bloquea: usa puertos locales, UDP y reloj, y en un ejecutor muy cargado puede dar un falso rojo. Si falla, mira el registro.
    # Ojo: lo que prueba es el protocolo, la seguridad y los comandos EN UNA MÁQUINA; entre dos móviles reales no se ha podido probar.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y jq openssl python3 python3-venv
      - name: nexo-tools contra sí mismo (dos dispositivos simulados)
        run: bash tests/ci_annotate.sh "nexo-tools contra sí mismo" -- env NEXO_TESTS_ONLY=tools bash tests/run_tests.sh
      # Playwright va en un entorno virtual propio: el pip del sistema de Ubuntu 24.04 no deja instalar en él (PEP 668) y, si cae en
      # la carpeta del usuario, un «python3 -I» no lo ve (así salió el código 77 en la v0.4.2). Con --77-falla, que no se pueda correr
      # (código 77) cuenta como fallo y la anotación dice qué faltaba: en CI las pruebas del navegador sí deben poder correr.
      - name: Instalar Playwright y Chromium
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          bash tests/ci_annotate.sh "Instalar Playwright" -- bash -c 'python3 -m venv "$RUNNER_TEMP/pw" && "$RUNNER_TEMP/pw/bin/python" -m pip install --quiet playwright'
          bash tests/ci_annotate.sh "Instalar Chromium" -- "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium
      - name: Gestor web en un Chromium sin pantalla (Playwright)
        run: bash tests/ci_annotate.sh --77-falla "Gestor web en un Chromium sin pantalla" -- "$RUNNER_TEMP/pw/bin/python" tests/ui_tests.py

  dbus:
    name: Probar nexo-dbus con un bus D-Bus real y con playerctl
    runs-on: ubuntu-latest
    # No bloquea: es una comprobación de compatibilidad con programas reales (busctl, gdbus, playerctl) que no se puede
    # ensayar en local. Si se pone en rojo, mira el registro: dice qué programa no entendió a nexo-dbus.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y jq dbus libglib2.0-bin playerctl
      - name: nexo-dbus contra un bus real (busctl y gdbus como clientes)
        run: bash tests/ci_annotate.sh "nexo-dbus con un bus real" -- env NEXO_TESTS_ONLY=dbus bash tests/run_tests.sh
      # (corre aunque el paso anterior falle: así un solo fallo no esconde el resultado de playerctl)
      - name: nexo-dbus con playerctl de verdad
        if: ${{ !cancelled() }}
        run: bash tests/ci_annotate.sh "nexo-dbus con playerctl" -- bash tests/playerctl_check.sh

  usb:
    name: Probar nexo usb (puentes PTY, RFC 2217 y TCP) contra la app simulada
    runs-on: ubuntu-latest
    # No bloquea: usa puertos locales, PTY y relojes (el reinicio del Arduino se mide en milisegundos) y en un ejecutor muy
    # cargado puede dar un falso rojo. Ojo: lo que prueba es el protocolo y los puentes contra una app SIMULADA; con una
    # placa y un móvil reales no se ha podido probar (para eso están tests/usb_hardware_check.sh y tests/usb_storage_hardware_check.sh).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y jq python3
      - name: nexo usb contra la app simulada
        run: bash tests/ci_annotate.sh "nexo usb contra la app simulada" -- env NEXO_TESTS_ONLY=usb bash tests/run_tests.sh
      - name: Las velocidades del test de Kotlin contra la referencia en Python
        if: ${{ !cancelled() }}
        run: python3 tests/ref_baud.py --check android/app/src/test/java/org/nexo/bridge/UsbSerialTest.kt

  apk:
    name: Compilar el APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Firma estable (opcional). Si creas estos secretos en el repositorio, todas las compilaciones
      # llevan la misma firma y se instalan encima de la anterior sin desinstalar. Si no existen,
      # el APK se firma con una clave de depuración y se instala igual (pero cada compilación es distinta).
      - name: Preparar la firma (si hay secretos)
        env:
          KS_B64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NEXO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexo.jks"
            {
              echo "NEXO_KEYSTORE=$RUNNER_TEMP/nexo.jks"
              echo "NEXO_KEYSTORE_PASSWORD=$KS_PASS"
              echo "NEXO_KEY_ALIAS=$KEY_ALIAS"
              echo "NEXO_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Se firmará con tu clave."
          else
            echo "Sin secretos de firma: se usará la clave de depuración."
          fi

      # Las pruebas de JVM de los controladores USB y de las reglas de los discos (sin móvil). No bloquean: si alguna falla, el registro dice cuál.
      - name: Pruebas de JVM (controladores USB y reglas de los discos)
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Poner nombre al APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nexo-${GITHUB_REF_NAME//\//-}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nexo-apk
          path: dist/*.apk

      - name: Publicar en la Release (solo con etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          # una etiqueta como v0.4.0-beta1 (con guion) se publica como versión preliminar
          prerelease: ${{ contains(github.ref_name, '-') }}
